<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>庭院盆栽 · 視差體驗</title>
  <style>
    :root {
      --panel: rgba(18, 22, 18, 0.58);
      --line: rgba(235, 240, 230, 0.14);
      --text: #f4f6f1;
      --muted: #b7c0b2;
      --accent: #6f8f62;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #121610;
      color: var(--text);
      font-family: "Iowan Old Style", "Palatino Linotype", "Songti TC", "Noto Serif TC", serif;
    }
    #overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: min(320px, calc(100vw - 40px));
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      padding: 18px 18px 16px;
      border-radius: 14px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.28rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    #status {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
      font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    }
    #start-btn {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      background: var(--accent);
      color: #f7faf4;
      border: none;
      border-radius: 999px;
      font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      letter-spacing: 0.04em;
    }
    #start-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(12, 16, 12, 0.42);
      color: var(--muted);
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    }
    #loading.show { opacity: 1; }
    #webcam { display: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="overlay">
    <h1>庭院 · 盆栽</h1>
    <p id="status">載入庭院光氛與主體盆栽中…</p>
    <button id="start-btn" disabled>開啟攝影機體驗</button>
  </div>
  <div id="loading" class="show">準備庭院…</div>
  <video id="webcam" playsinline></video>

  <script>
    const PLANT_URL = 'assets/potted_plant_01/potted_plant_01_1k.gltf';
    const HDR_URL = 'assets/courtyard_1k.hdr';

    const scene = new THREE.Scene();
    const lookAt = new THREE.Vector3(0, 0.42, 0);
    const initialCamZ = 2.35;
    const rangeX = 1.35;
    const rangeY = 0.85;

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 80);
    camera.position.set(0, 0.55, initialCamZ);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.physicallyCorrectLights = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xf2efe4, 0x3d4a38, 0.55));
    const sun = new THREE.DirectionalLight(0xfff3d8, 1.35);
    sun.position.set(3.5, 6.5, 2.2);
    scene.add(sun);
    const bounce = new THREE.DirectionalLight(0xc9d7c2, 0.35);
    bounce.position.set(-3, 1.5, -2);
    scene.add(bounce);

    const plantRoot = new THREE.Group();
    scene.add(plantRoot);

    let targetX = 0;
    let targetY = 0.55;
    let targetZ = initialCamZ;
    const clock = new THREE.Clock();
    const statusText = document.getElementById('status');
    const loadingEl = document.getElementById('loading');
    const startBtn = document.getElementById('start-btn');

    function loadGltf(url) {
      return new Promise((resolve, reject) => {
        new THREE.GLTFLoader().load(url, resolve, undefined, reject);
      });
    }

    function loadEnv() {
      return new Promise((resolve) => {
        new THREE.RGBELoader().load(
          HDR_URL,
          (texture) => {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileEquirectangularShader();
            const envMap = pmrem.fromEquirectangular(texture).texture;
            scene.environment = envMap;
            scene.background = envMap;
            scene.backgroundBlurriness = 0.08;
            // r128 may not support backgroundBlurriness; ignore if ignored
            texture.dispose();
            pmrem.dispose();
            resolve();
          },
          undefined,
          () => resolve()
        );
      });
    }

    function frameObject(object3d) {
      const box = new THREE.Box3().setFromObject(object3d);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      object3d.position.sub(center);
      object3d.position.y += size.y * 0.5;
      lookAt.set(0, size.y * 0.45, 0);
      camera.position.set(0, lookAt.y + 0.12, initialCamZ);
      targetY = camera.position.y;
    }

    async function boot() {
      try {
        await Promise.all([loadEnv(), (async () => {
          const gltf = await loadGltf(PLANT_URL);
          const plant = gltf.scene;
          plant.traverse((obj) => {
            if (obj.isMesh) {
              obj.castShadow = false;
              obj.receiveShadow = false;
              if (obj.material) {
                obj.material.envMapIntensity = 0.85;
              }
            }
          });
          plantRoot.add(plant);
          frameObject(plant);
        })()]);
        loadingEl.classList.remove('show');
        statusText.textContent = '開啟鏡頭後，緩緩左右前後移動頭部，感受庭院景深。';
        startBtn.disabled = false;
      } catch (err) {
        console.error(err);
        loadingEl.classList.remove('show');
        statusText.textContent = '盆栽載入失敗，請稍後再試。';
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const videoElement = document.getElementById('webcam');
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    faceMesh.onResults((results) => {
      if (!results.multiFaceLandmarks?.length) return;
      const nose = results.multiFaceLandmarks[0][1];
      targetX = (0.5 - nose.x) * rangeX;
      targetY = lookAt.y + 0.12 + (0.5 - nose.y) * rangeY;
      targetZ = initialCamZ + nose.z * 2.8;
      statusText.textContent = '追蹤中：慢慢移動頭部，感受盆栽與庭院的前後層次。';
    });

    startBtn.addEventListener('click', async () => {
      statusText.textContent = '正在開啟相機…';
      startBtn.disabled = true;
      try {
        const cameraUtil = new Camera(videoElement, {
          onFrame: async () => { await faceMesh.send({ image: videoElement }); },
          width: 640,
          height: 480
        });
        await cameraUtil.start();
        startBtn.style.display = 'none';
      } catch (err) {
        console.error(err);
        statusText.textContent = '無法開啟相機，請確認權限並以 HTTPS 連線。';
        startBtn.disabled = false;
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      plantRoot.rotation.y = Math.sin(t * 0.15) * 0.04;

      camera.position.x += (targetX - camera.position.x) * 0.07;
      camera.position.y += (targetY - camera.position.y) * 0.07;
      camera.position.z += (targetZ - camera.position.z) * 0.07;
      camera.lookAt(lookAt);
      renderer.render(scene, camera);
    }

    animate();
    boot();
  </script>
</body>
</html>
