<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webcam 3D 視差場景</title>
  <style>
    :root {
      --panel: rgba(8, 12, 18, 0.72);
      --line: rgba(255, 255, 255, 0.12);
      --text: #f2f5f8;
      --muted: #9aa7b5;
      --accent: #3aa0ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #07090d;
      color: var(--text);
      font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    }
    #overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: min(360px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      padding: 16px;
      border-radius: 12px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    #status {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    button, .scene-btn {
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    #start-btn {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
      font-weight: 600;
    }
    button:disabled, .scene-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .scene-btn.active {
      background: rgba(58, 160, 255, 0.22);
      border-color: rgba(58, 160, 255, 0.7);
    }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(7, 9, 13, 0.55);
      color: var(--muted);
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #loading.show { opacity: 1; }
    #webcam { display: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="overlay">
    <h1>Webcam 3D 視差場景</h1>
    <p id="status">選場景後開啟鏡頭，用頭部左右前後移動感受視差</p>
    <div class="row" id="scene-btns"></div>
    <button id="start-btn">開啟攝影機體驗</button>
  </div>
  <div id="loading">載入範本資產中…</div>
  <video id="webcam" playsinline></video>

  <script>
    const ASSET = {
      tokyo: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r152/examples/models/gltf/LittlestTokyo.glb',
      neil: 'https://modelviewer.dev/shared-assets/models/NeilArmstrong.glb',
      astronaut: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb',
      robot: 'https://modelviewer.dev/shared-assets/models/RobotExpressive.glb',
      parrot: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r152/examples/models/gltf/Parrot.glb',
      flamingo: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r152/examples/models/gltf/Flamingo.glb',
      hdr: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r152/examples/textures/equirectangular/royal_esplanade_1k.hdr'
    };

    function playClips(gltf, root, ctx) {
      if (!gltf.animations?.length) return;
      const mixer = new THREE.AnimationMixer(root);
      gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
      ctx.mixers.push(mixer);
    }

    const sceneDefs = {
      tokyo: async (root, ctx) => {
        const gltf = await ctx.loadGltf(ASSET.tokyo);
        const model = gltf.scene;
        model.position.set(0.8, 0.6, 0);
        model.scale.setScalar(0.01);
        root.add(model);
        playClips(gltf, model, ctx);
      },
      studio: async (root, ctx) => {
        const [neil, astronaut, robot] = await Promise.all([
          ctx.loadGltf(ASSET.neil),
          ctx.loadGltf(ASSET.astronaut),
          ctx.loadGltf(ASSET.robot)
        ]);

        neil.scene.position.set(0, -0.95, 0);
        neil.scene.scale.setScalar(1.05);
        root.add(neil.scene);

        astronaut.scene.position.set(-1.7, -0.95, 0.15);
        astronaut.scene.scale.setScalar(1.15);
        astronaut.scene.rotation.y = 0.45;
        root.add(astronaut.scene);

        robot.scene.position.set(1.7, -0.95, 0.1);
        robot.scene.scale.setScalar(0.55);
        robot.scene.rotation.y = -0.55;
        root.add(robot.scene);
        playClips(robot, robot.scene, ctx);
      },
      aviary: async (root, ctx) => {
        const [parrot, flamingo] = await Promise.all([
          ctx.loadGltf(ASSET.parrot),
          ctx.loadGltf(ASSET.flamingo)
        ]);

        parrot.scene.position.set(-1.4, 0.9, 0.2);
        parrot.scene.scale.setScalar(0.035);
        root.add(parrot.scene);
        playClips(parrot, parrot.scene, ctx);

        flamingo.scene.position.set(1.6, 0.35, -0.4);
        flamingo.scene.scale.setScalar(0.035);
        flamingo.scene.rotation.y = Math.PI * 0.85;
        root.add(flamingo.scene);
        playClips(flamingo, flamingo.scene, ctx);
      }
    };

    const SCENES = [
      {
        id: 'studio',
        label: '角色陳列',
        lookAt: new THREE.Vector3(0, 0.35, 0),
        camZ: 4.2,
        rangeX: 2.8,
        rangeY: 1.6,
        build: sceneDefs.studio
      },
      {
        id: 'tokyo',
        label: '東京微縮',
        lookAt: new THREE.Vector3(0, 1.2, 0),
        camZ: 8,
        rangeX: 3.2,
        rangeY: 1.8,
        build: sceneDefs.tokyo
      },
      {
        id: 'aviary',
        label: '飛行生物',
        lookAt: new THREE.Vector3(0, 0.6, 0),
        camZ: 6.5,
        rangeX: 4.0,
        rangeY: 2.2,
        build: sceneDefs.aviary
      }
    ];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1018);
    scene.fog = new THREE.Fog(0x0b1018, 12, 42);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 200);
    let lookAt = new THREE.Vector3(0, 0.5, 0);
    let initialCamZ = 5;
    let rangeX = 3;
    let rangeY = 1.8;
    camera.position.set(0, 0.6, initialCamZ);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.physicallyCorrectLights = true;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xddeeff, 0x223344, 0.55);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xfff2dd, 1.6);
    key.position.set(4, 7, 5);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x88aaff, 0.45);
    fill.position.set(-5, 2, -3);
    scene.add(fill);

    const gltfLoader = new THREE.GLTFLoader();
    const clock = new THREE.Clock();
    const contentRoot = new THREE.Group();
    scene.add(contentRoot);

    const runtime = {
      mixers: [],
      spin: [],
      loadGltf(url, timeoutMs = 45000) {
        return new Promise((resolve, reject) => {
          let done = false;
          const timer = setTimeout(() => {
            if (done) return;
            done = true;
            reject(new Error('timeout: ' + url));
          }, timeoutMs);
          gltfLoader.load(
            url,
            (gltf) => {
              if (done) return;
              done = true;
              clearTimeout(timer);
              resolve(gltf);
            },
            undefined,
            (err) => {
              if (done) return;
              done = true;
              clearTimeout(timer);
              reject(err);
            }
          );
        });
      }
    };

    const statusText = document.getElementById('status');
    const loadingEl = document.getElementById('loading');
    const sceneBtns = document.getElementById('scene-btns');
    let currentSceneId = SCENES[0].id;
    let loading = false;

    function setLoading(on, msg) {
      loading = on;
      loadingEl.classList.toggle('show', on);
      if (msg) loadingEl.textContent = msg;
      [...sceneBtns.querySelectorAll('button')].forEach((b) => { b.disabled = on; });
    }

    function loadEnv() {
      return Promise.race([
        new Promise((resolve) => {
          new THREE.RGBELoader().load(
            ASSET.hdr,
            (texture) => {
              texture.mapping = THREE.EquirectangularReflectionMapping;
              const pmrem = new THREE.PMREMGenerator(renderer);
              pmrem.compileEquirectangularShader();
              scene.environment = pmrem.fromEquirectangular(texture).texture;
              texture.dispose();
              pmrem.dispose();
              resolve();
            },
            undefined,
            () => resolve()
          );
        }),
        new Promise((resolve) => setTimeout(resolve, 4000))
      ]);
    }

    async function switchScene(id) {
      if (loading) return;
      if (id === currentSceneId && contentRoot.children.length) {
        [...sceneBtns.children].forEach((b) => b.classList.toggle('active', b.dataset.id === id));
        return;
      }

      const def = SCENES.find((s) => s.id === id);
      if (!def) return;

      setLoading(true, `載入「${def.label}」…`);
      currentSceneId = id;
      [...sceneBtns.children].forEach((b) => b.classList.toggle('active', b.dataset.id === id));

      while (contentRoot.children.length) {
        const child = contentRoot.children[0];
        contentRoot.remove(child);
        child.traverse?.((obj) => {
          if (obj.geometry) obj.geometry.dispose?.();
          if (obj.material) {
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            mats.forEach((m) => {
              Object.values(m).forEach((v) => v?.isTexture && v.dispose?.());
              m.dispose?.();
            });
          }
        });
      }
      runtime.mixers.length = 0;
      runtime.spin.length = 0;

      lookAt.copy(def.lookAt);
      initialCamZ = def.camZ;
      rangeX = def.rangeX;
      rangeY = def.rangeY;
      targetX = 0;
      targetY = lookAt.y * 0.15;
      targetZ = initialCamZ;
      camera.position.set(0, lookAt.y + 0.35, initialCamZ);

      try {
        await def.build(contentRoot, runtime);
        statusText.textContent = `場景：${def.label}。開啟鏡頭後移動頭部感受視差。`;
      } catch (err) {
        console.error(err);
        statusText.textContent = `「${def.label}」載入失敗，請檢查網路後再試。`;
      } finally {
        setLoading(false);
      }
    }

    SCENES.forEach((s) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'scene-btn';
      btn.dataset.id = s.id;
      btn.textContent = s.label;
      btn.addEventListener('click', () => switchScene(s.id));
      sceneBtns.appendChild(btn);
    });

    let targetX = 0;
    let targetY = 0.2;
    let targetZ = initialCamZ;

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const videoElement = document.getElementById('webcam');
    const startBtn = document.getElementById('start-btn');

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    faceMesh.onResults((results) => {
      if (!results.multiFaceLandmarks?.length) return;
      const nose = results.multiFaceLandmarks[0][1];
      targetX = (0.5 - nose.x) * rangeX;
      targetY = lookAt.y + (0.5 - nose.y) * rangeY;
      targetZ = initialCamZ + (nose.z * 4.5);
      statusText.textContent = '追蹤中：左右前後移動頭部感受景深與視差';
    });

    startBtn.addEventListener('click', async () => {
      statusText.textContent = '正在載入臉部模型並開啟相機…';
      startBtn.disabled = true;
      try {
        const cameraUtil = new Camera(videoElement, {
          onFrame: async () => { await faceMesh.send({ image: videoElement }); },
          width: 640,
          height: 480
        });
        await cameraUtil.start();
        startBtn.style.display = 'none';
      } catch (err) {
        console.error(err);
        statusText.textContent = '無法開啟相機，請確認權限並以 HTTPS 連線。';
        startBtn.disabled = false;
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      runtime.mixers.forEach((m) => m.update(dt));
      runtime.spin.forEach((obj) => { obj.rotation.y += dt * 0.25; });

      camera.position.x += (targetX - camera.position.x) * 0.08;
      camera.position.y += (targetY - camera.position.y) * 0.08;
      camera.position.z += (targetZ - camera.position.z) * 0.08;
      camera.lookAt(lookAt);
      renderer.render(scene, camera);
    }

    animate();
    loadEnv();
    switchScene(SCENES[0].id);
  </script>
</body>
</html>
